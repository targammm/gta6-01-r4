<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Solmar Bay — open-world crime game</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0b0e13; font-family: Arial, Helvetica, sans-serif; }
  #game-canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #fff; }
  .hud-topleft { position: absolute; top: 18px; left: 20px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .hud-money { font-size: 40px; font-weight: 900; color: #ffd23f; letter-spacing: 1px; }
  .hud-sub { font-size: 17px; font-weight: 700; color: #e8ecf1; margin-top: 2px; }
  .hud-objective { font-size: 19px; font-weight: 800; color: #ffd23f; margin-top: 10px; max-width: 560px; line-height: 1.3; }
  .hud-topright { position: absolute; top: 18px; right: 20px; text-align: right; }
  .hud-stars { font-size: 34px; color: #ffd23f; text-shadow: 0 2px 6px rgba(0,0,0,.8); letter-spacing: 3px; min-height: 40px; }
  .hud-healthwrap { width: 230px; height: 16px; background: rgba(0,0,0,.55); border: 2px solid rgba(255,255,255,.7); margin-left: auto; margin-top: 6px; }
  .hud-healthbar { height: 100%; width: 100%; background: #39d353; }
  .hud-healthtext { font-size: 14px; font-weight: 800; margin-top: 4px; text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .hud-banner { position: absolute; top: 15%; left: 0; right: 0; text-align: center; font-size: 37px; font-weight: 900; color: #ffd23f; text-shadow: 0 3px 10px rgba(0,0,0,.9); padding: 0 40px; transition: opacity .3s; }
  .hud-message { position: absolute; top: 55%; left: 0; right: 0; text-align: center; font-size: 25px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.9); transition: opacity .3s; }
  .hud-bottomleft { position: absolute; left: 20px; bottom: 248px; text-shadow: 0 2px 6px rgba(0,0,0,.85); }
  .hud-speed { font-size: 42px; font-weight: 900; }
  .hud-kmh { font-size: 20px; font-weight: 700; }
  .hud-prompt { font-size: 23px; font-weight: 800; color: #ffd23f; margin-top: 6px; }
  .hud-controls { position: absolute; left: 20px; bottom: 14px; font-size: 14px; font-weight: 600; color: rgba(255,255,255,.85); text-shadow: 0 1px 4px rgba(0,0,0,.9); }
  .hud-crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 26px; font-weight: 300; color: rgba(255,255,255,.9); text-shadow: 0 0 4px rgba(0,0,0,.8); display: none; }
  .hud-mapwrap { position: absolute; right: 20px; bottom: 20px; border: 3px solid rgba(255,255,255,.75); border-radius: 6px; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.5); }
  .hud-minimap { display: block; }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="hud"></div>
<style>
  .hud-title { position: absolute; inset: 0; text-align: center; padding-top: 9vh; background: linear-gradient(180deg, rgba(5,8,14,.25) 0%, rgba(5,8,14,0) 30%, rgba(5,8,14,0) 62%, rgba(5,8,14,.45) 100%); }
  .hud-title-name { font-size: 92px; font-weight: 900; letter-spacing: 6px; color: #ffd23f; text-shadow: 0 6px 0 #c2185b, 0 12px 34px rgba(0,0,0,.75); }
  .hud-title-tag { font-size: 27px; font-weight: 800; color: #7fe3ff; letter-spacing: 4px; margin-top: 6px; text-shadow: 0 3px 10px rgba(0,0,0,.85); }
  .hud-title-story { max-width: 880px; margin: 26px auto 0; font-size: 20px; line-height: 1.45; font-weight: 600; color: #f2f5f8; text-shadow: 0 2px 8px rgba(0,0,0,.95); padding: 0 30px; }
  .hud-title-save { margin-top: 20px; font-size: 17px; font-weight: 700; color: #ffd23f; text-shadow: 0 2px 6px rgba(0,0,0,.9); }
  .hud-title-press { margin-top: 16px; font-size: 30px; font-weight: 900; letter-spacing: 3px; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,.9); }
  .hud-title-controls { margin-top: 22px; font-size: 16.5px; line-height: 1.55; font-weight: 600; color: rgba(255,255,255,.92); text-shadow: 0 1px 5px rgba(0,0,0,.95); }
  .hud-overlay { position: absolute; inset: 0; background: rgba(5,8,14,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .hud-overlay-title { font-size: 74px; font-weight: 900; letter-spacing: 6px; color: #ffd23f; text-shadow: 0 5px 22px rgba(0,0,0,.9); }
  .hud-overlay-sub { font-size: 23px; font-weight: 700; color: #fff; margin-top: 12px; text-shadow: 0 2px 8px rgba(0,0,0,.9); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
