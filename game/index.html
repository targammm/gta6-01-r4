<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOLMAR BAY — an original open-world crime game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a120b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; inset: 0; pointer-events: none; font-family: Arial, Helvetica, sans-serif; color: #fff; }
  #hud * { pointer-events: none; }
  .sr-status { position: absolute; width: 1px; height: 1px; overflow: hidden; opacity: 0; }

  /* Top-left block: money, run stats, and the objective — constrained to
     the left half of the screen so it can never slide under the health
     bar on the right. */
  .hud-left { position: absolute; top: 16px; left: 18px; max-width: 52vw; }
  .hud-money { font-size: 40px; font-weight: bold; color: #ffd83d; text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; line-height: 1; }
  .hud-sub { font-size: 17px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; margin-top: 4px; }
  .hud-objective { font-size: 19px; font-weight: bold; color: #ffe98a; text-shadow: 1px 1px 0 #000; margin-top: 6px; line-height: 1.25; }

  /* Top-right: wanted stars and the health bar. */
  .hud-right { position: absolute; top: 16px; right: 18px; text-align: right; }
  .hud-stars { font-size: 34px; line-height: 1; text-shadow: 1px 1px 0 #000; }
  .hud-stars .on { color: #ffd83d; }
  .hud-stars .off { color: rgba(255,255,255,0.25); }
  .hud-health { width: 220px; height: 22px; border: 2px solid #fff; background: rgba(0,0,0,0.45); margin-top: 8px; margin-left: auto; box-shadow: 1px 1px 0 #000; }
  .hud-health-fill { height: 100%; width: 100%; background: #43d653; transition: width 0.15s linear; }
  .hud-health-num { font-size: 15px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; margin-top: 4px; }

  /* Mission banner: one line, centred, clear of the objective block. */
  .hud-banner {
    position: absolute; top: max(15%, 150px); left: 50%; transform: translateX(-50%);
    max-width: 96%; white-space: nowrap; overflow: hidden;
    font-size: 20px; font-weight: bold; color: #ffd83d; text-align: center;
    text-shadow: 2px 2px 0 #000, -1px -1px 0 #000; display: none;
  }
  /* Centre message: narrow and centred so long lines wrap inside the
     frame and stay clear of the minimap. */
  .hud-message {
    position: absolute; top: 55%; left: 50%; transform: translateX(-50%);
    max-width: 36%; text-align: center;
    font-size: 19px; font-weight: bold; color: #fff;
    text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; line-height: 1.3; display: none;
  }

  /* Bottom-left: speed and the contextual prompt. */
  .hud-bl { position: absolute; left: 18px; bottom: 48px; }
  .hud-speed { font-size: 52px; font-weight: bold; color: #fff; text-shadow: 2px 2px 0 #000; line-height: 1; display: none; }
  .hud-speed-unit { font-size: 16px; color: #ffd83d; }
  .hud-prompt { font-size: 20px; font-weight: bold; color: #57ff8a; text-shadow: 1px 1px 0 #000; margin-top: 6px; min-height: 24px; }

  .hud-minimap { position: absolute; right: 18px; bottom: 16px; width: 220px; height: 220px; border: 3px solid #fff; box-shadow: 2px 2px 0 rgba(0,0,0,0.6); background: #20262e; }
  .hud-controls { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); font-size: 15px; color: rgba(255,255,255,0.9); text-shadow: 1px 1px 0 #000; white-space: nowrap; }
  .hud-crosshair { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 30px; font-weight: bold; color: #fff; text-shadow: 1px 1px 0 #000; display: none; }

  /* Title card. */
  .hud-title {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 760px; max-width: 92vw; box-sizing: border-box;
    background: rgba(10, 14, 24, 0.82); border: 3px solid #ffd83d;
    padding: 26px 38px 22px; text-align: center; display: none;
  }
  .hud-title h1 { margin: 0; font-size: 64px; letter-spacing: 4px; color: #ffd83d; text-shadow: 3px 3px 0 #a33; line-height: 1.05; }
  .hud-tagline { font-size: 18px; color: #7dd3fc; margin-top: 6px; }
  .hud-story { font-size: 17px; line-height: 1.45; color: #f3f4f6; margin: 14px 0 0; }
  .hud-saveinfo { font-size: 16px; color: #57ff8a; margin-top: 12px; }
  .hud-press { font-size: 26px; font-weight: bold; color: #fff; margin-top: 14px; }
  .hud-title-controls { font-size: 14px; color: rgba(255,255,255,0.85); margin-top: 12px; line-height: 1.5; }
  @keyframes hudblink { 50% { opacity: 0.25; } }

  /* Pause / dead / busted overlays. */
  .hud-overlay {
    position: absolute; inset: 0; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); text-align: center;
  }
  .hud-overlay.dead { background: rgba(70, 4, 4, 0.5); }
  .hud-overlay.busted { background: rgba(16, 36, 110, 0.5); }
  .hud-overlay-title { font-size: 44px; font-weight: bold; letter-spacing: 3px; color: #fff; text-shadow: 2px 2px 0 #000; }
  .hud-overlay-sub { font-size: 18px; color: #f3f4f6; text-shadow: 1px 1px 0 #000; margin-top: 8px; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud"></div>
<div class="sr-status" role="status" aria-live="polite">SOLMAR BAY — open-world crime game. Press Enter to play.</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
